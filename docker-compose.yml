services:

  postgres:
    image: postgres:16
    container_name: retail_postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: retail_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase
    container_name: retail_metabase

    ports:
      - "3000:3000"

    depends_on:
      - postgres

volumes:
  postgres_data: